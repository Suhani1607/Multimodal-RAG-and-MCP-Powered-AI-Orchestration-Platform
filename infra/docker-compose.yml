services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_mcp
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rag_mcp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
